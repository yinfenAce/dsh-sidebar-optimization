name: Feature request
description: Suggest a mobile UX improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the plugin do?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope / compatibility
      description: Does it affect the drawer, settings card, balance, or other pages?
