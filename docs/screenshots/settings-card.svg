<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1080" viewBox="0 0 800 1080">
  <rect width="800" height="1080" fill="#0f0f10"/>
  <rect x="40" y="40" width="720" height="1000" rx="26" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="1.5"/>
  <text x="80" y="104" fill="#f5f5f7" font-family="sans-serif" font-size="30" font-weight="700">主页排版设置</text>
  <text x="300" y="104" fill="#8e8e93" font-family="monospace" font-size="16">v0.3.13</text>
  <text x="80" y="156" fill="#8e8e93" font-family="sans-serif" font-size="16">拖动滑杆实时预览侧栏宽度；点击卡片外区域关闭</text>

  <text x="80" y="224" fill="#f5f5f7" font-family="sans-serif" font-size="19">侧栏宽度</text>
  <text x="640" y="224" fill="#f5f5f7" font-family="sans-serif" font-size="19">60%</text>
  <rect x="80" y="246" width="600" height="6" rx="3" fill="#3a3a3c"/>
  <rect x="80" y="246" width="300" height="6" rx="3" fill="#f5f5f7"/>
  <circle cx="380" cy="249" r="11" fill="#ffffff"/>
  <text x="80" y="286" fill="#8e8e93" font-family="sans-serif" font-size="14">45%</text>
  <text x="650" y="286" fill="#8e8e93" font-family="sans-serif" font-size="14">80%</text>

  <line x1="80" y1="330" x2="680" y2="330" stroke="#2c2c2e"/>
  <text x="80" y="382" fill="#f5f5f7" font-family="sans-serif" font-size="17">滑动检测范围</text>
  <text x="620" y="382" fill="#f5f5f7" font-family="sans-serif" font-size="17">33%</text>
  <rect x="80" y="402" width="600" height="6" rx="3" fill="#3a3a3c"/>
  <rect x="80" y="402" width="260" height="6" rx="3" fill="#7cc4ff"/>
  <circle cx="340" cy="405" r="11" fill="#ffffff"/>

  <line x1="80" y1="450" x2="680" y2="450" stroke="#2c2c2e"/>
  <text x="80" y="504" fill="#f5f5f7" font-family="sans-serif" font-size="17">余额隐私（显示为星号）</text>
  <rect x="602" y="484" width="54" height="30" rx="15" fill="#3a3a3c"/>
  <circle cx="640" cy="499" r="12" fill="#f5f5f7"/>
  <text x="80" y="556" fill="#f5f5f7" font-family="sans-serif" font-size="17">余额预警（≤阈值时数字变红）</text>
  <rect x="602" y="536" width="54" height="30" rx="15" fill="#0a84ff"/>
  <circle cx="642" cy="551" r="12" fill="#ffffff"/>
  <text x="80" y="602" fill="#8e8e93" font-family="sans-serif" font-size="15">预警阈值（元）</text>
  <text x="620" y="602" fill="#f5f5f7" font-family="monospace" font-size="17">1.00</text>

  <line x1="80" y1="640" x2="680" y2="640" stroke="#2c2c2e"/>
  <text x="80" y="700" fill="#f5f5f7" font-family="sans-serif" font-size="18">手动用量入口</text>
  <rect x="80" y="722" width="600" height="44" rx="10" fill="#111113" stroke="#3a3a3c"/>
  <text x="96" y="750" fill="#8e8e93" font-family="sans-serif" font-size="14">插件包名（可选，如 dsh-context）</text>
  <rect x="80" y="776" width="600" height="44" rx="10" fill="#111113" stroke="#3a3a3c"/>
  <text x="96" y="804" fill="#8e8e93" font-family="sans-serif" font-size="14">入口文字（如 上下文）</text>
  <rect x="80" y="834" width="292" height="42" rx="10" fill="#111113" stroke="#3a3a3c"/>
  <text x="112" y="861" fill="#f5f5f7" font-family="sans-serif" font-size="15">扫描当前入口</text>
  <rect x="388" y="834" width="292" height="42" rx="10" fill="#111113" stroke="#3a3a3c"/>
  <text x="440" y="861" fill="#f5f5f7" font-family="sans-serif" font-size="15">验证入口</text>
  <rect x="80" y="888" width="600" height="42" rx="10" fill="#f5f5f7"/>
  <text x="334" y="915" fill="#111113" font-family="sans-serif" font-size="15" font-weight="600">保存手动入口</text>

  <text x="80" y="976" fill="#8e8e93" font-family="sans-serif" font-size="14">优先级：手动入口 → 自动识别 → 平台用量页</text>
  <text x="80" y="1004" fill="#636366" font-family="sans-serif" font-size="12">结构示意 · 非实机截图</text>
</svg>
